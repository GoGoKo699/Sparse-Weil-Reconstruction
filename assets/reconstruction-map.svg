<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" role="img" aria-labelledby="title desc">
  <title id="title">Two routes from exact counts to one polynomial</title>
  <desc id="desc">The input consists of known integers q and g and true exact cyclic-resultant values K_m at the indices chosen by one of two routes, with an integral q-reciprocal Weil polynomial promised. The first-g route uses indices 1 through g when g is at least 1 and q is at least 65,536 times g squared, and reconstructs by coefficient correction and exact rounding. The sparse route sets h equal to g minus 2 and uses the union of indices 1 through h and the even indices 2 through 2h, when g is at least 32 and q is at least 2, using Möbius and Newton reconstruction and endpoint completion. Each route outputs all coefficients of P in deterministic bit time polynomial in g and log q.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#91a8b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { fill: #243746; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .math { font-family: Georgia, "Times New Roman", serif; }
      .muted { fill: #425b6b; }
      .line { fill: none; stroke: #91a8b9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="900" height="740" rx="18" fill="#f8fbfd"/>
  <text x="450" y="48" text-anchor="middle" font-size="30" font-weight="650">Two routes from exact counts to one polynomial</text>

  <rect x="40" y="82" width="820" height="160" rx="14" fill="#ffffff" stroke="#91a8b9" stroke-width="1.5"/>
  <text x="64" y="119" font-size="22" font-weight="650">The input promise</text>
  <text x="64" y="155" font-size="23">Known q, g; true exact K<tspan baseline-shift="sub" font-size="17">m</tspan> at the chosen indices</text>
  <text x="64" y="189" font-size="22" class="muted">Integral P with constant coefficient 1 and inverse roots α<tspan baseline-shift="sub" font-size="16">i</tspan>:</text>
  <text x="64" y="223" font-size="25" class="math">c<tspan baseline-shift="sub" font-size="18">2g−j</tspan><tspan baseline-shift="baseline" dx="7">=</tspan><tspan dx="7">q</tspan><tspan baseline-shift="super" font-size="18">g−j</tspan><tspan baseline-shift="baseline" dx="3">c</tspan><tspan baseline-shift="sub" font-size="18">j</tspan></text>
  <text x="315" y="223" font-size="25" class="math">and</text>
  <text x="370" y="223" font-size="25" class="math">|α<tspan baseline-shift="sub" font-size="18">i</tspan><tspan baseline-shift="baseline">| = √q</tspan></text>

  <path class="line" d="M 450 242 V 265 M 237 284 V 265 H 663 V 284"/>
  <path class="line" d="M 237 277 V 294" marker-end="url(#arrow)"/>
  <path class="line" d="M 663 277 V 294" marker-end="url(#arrow)"/>

  <rect x="40" y="294" width="394" height="238" rx="14" fill="#ffffff" stroke="#91a8b9" stroke-width="1.5"/>
  <path d="M 54 294 H 420 Q 434 294 434 308 V 353 H 40 V 308 Q 40 294 54 294 Z" fill="#d9e8f2"/>
  <text x="64" y="333" font-size="25" font-weight="650">First-g route</text>
  <text x="64" y="390" font-size="27" class="math">Indices 1, …, g</text>
  <text x="64" y="428" font-size="24" class="math">g ≥ 1   ·   q ≥ 65,536g²</text>
  <text x="64" y="477" font-size="24">Coefficient correction</text>
  <text x="64" y="511" font-size="22" class="muted">Contract → round exactly</text>

  <rect x="466" y="294" width="394" height="238" rx="14" fill="#ffffff" stroke="#91a8b9" stroke-width="1.5"/>
  <path d="M 480 294 H 846 Q 860 294 860 308 V 353 H 466 V 308 Q 466 294 480 294 Z" fill="#e8f1f7"/>
  <text x="490" y="333" font-size="25" font-weight="650">Sparse route</text>
  <text x="490" y="390" font-size="23" class="math">h = g − 2;   g ≥ 32;   q ≥ 2</text>
  <text x="490" y="428" font-size="23" class="math">D<tspan baseline-shift="sub" font-size="17">h</tspan><tspan baseline-shift="baseline" dx="5">= {1, …, h} ∪ {2, 4, …, 2h}</tspan></text>
  <text x="490" y="477" font-size="24">Möbius / Newton</text>
  <text x="490" y="511" font-size="22" class="muted">Complete from endpoints</text>

  <path class="line" d="M 237 532 V 561 H 663 V 532 M 450 561 V 594" marker-end="url(#arrow)"/>
  <rect x="40" y="596" width="820" height="108" rx="14" fill="#e8f1f7" stroke="#91a8b9" stroke-width="1.5"/>
  <text x="450" y="639" text-anchor="middle" font-size="27" font-weight="650">All coefficients of P</text>
  <text x="450" y="679" text-anchor="middle" font-size="23" class="muted">Deterministic bit time polynomial in g and log q</text>
</svg>
